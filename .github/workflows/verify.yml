name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  node:
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: node --test test/core.test.cjs test/dashboard.test.cjs
      - run: npm run test:rollback
      - run: npm run test:packed
      - run: npm run test:secrets
      - name: Install MCP dependencies for integration diagnostics
        run: |
          root_tarball=$(npm pack --silent --pack-destination "$RUNNER_TEMP")
          npm install --prefix mcp-server --ignore-scripts --no-package-lock "$RUNNER_TEMP/$root_tarball"
      - run: node bin/vibe-diag.js complete --json
